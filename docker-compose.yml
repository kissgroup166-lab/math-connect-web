# Runs the app container. Start Supabase first with `npm run db:start`
# (the Supabase CLI runs its own Docker containers on ports 54321–54324).
#   docker compose up dev          → dev server with live reload (edits show on save)
#   docker compose --profile prod up web --build  → production build
# Both use port 3000, so run one at a time.
services:
  dev:
    image: node:24-alpine
    working_dir: /app
    command: sh -c "corepack enable && pnpm install --frozen-lockfile && pnpm exec vite dev --host 0.0.0.0 --port 3000"
    ports:
      - '3000:3000'
    env_file: .env
    environment:
      SUPABASE_URL: ${DOCKER_SUPABASE_URL:-http://host.docker.internal:54321}
      # Skip the Netlify plugin's emulation inside the container, and poll for file changes.
      TARGET: node
      WATCH_POLL: '1'
      COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
    volumes:
      - .:/app
      # Linux node_modules live in the container, separate from the Windows ones on the host.
      - dev_node_modules:/app/node_modules
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    restart: unless-stopped

  web:
    profiles: [prod]
    build: .
    ports:
      - '3000:3000'
    env_file: .env
    environment:
      # Inside the container, the host's Supabase is reached through host.docker.internal.
      SUPABASE_URL: ${DOCKER_SUPABASE_URL:-http://host.docker.internal:54321}
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    restart: unless-stopped

volumes:
  dev_node_modules:
